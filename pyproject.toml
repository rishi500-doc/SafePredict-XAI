[project]
name = "safepredict-xai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "polars>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "shap>=0.45.0,<0.52.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "streamlit>=1.35.0",
    "jupyter>=1.0.0",
    "websocket-client==1.9.0",
]

[dependency-groups]
dev = [
    "polars>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "shap>=0.45.0,<0.52.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "streamlit>=1.35.0",
    "jupyter>=1.0.0",
    "notebook>=7.5.7",
]

[tool.pyright]
pythonVersion = "3.9"
pythonPlatform = "Windows"
venvPath = "."
venv = ".venv"
extraPaths = ["."]
typeCheckingMode = "basic"
reportArgumentType = "none"
reportCallIssue = "none"

